<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- <link> にすることでブラウザのプリロードスキャナーが即座に発見できる
         （CSSの @import はCSS解析が終わるまで発見されずレンダリングをブロックする）。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <title>ジムボード</title>
    <meta name="description" content="ジムボード - パーソナルジム・ピラティス・ヨガ専用の予約・顧客管理アプリ">
    <meta name="author" content="ジムボード" />

    <!-- SNS 共有時のカード。以前は Lovable（開発基盤）の作者名・アカウント・
         外部ホストの画像が残っていた。自前のアイコンに差し替えてある
         （画像は絶対URLである必要があるので PRODUCTION_WEB_ORIGIN を直書き）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ジムボード" />
    <meta property="og:url" content="https://app.kyoto-salute.com/" />
    <meta property="og:image" content="https://app.kyoto-salute.com/icon-512.png">

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://app.kyoto-salute.com/icon-512.png">
    
  
  
  
  <meta property="og:title" content="ジムボード">
  <meta name="twitter:title" content="ジムボード">
  <meta property="og:description" content="ジムボード - パーソナルジム・ピラティス・ヨガ専用の予約・顧客管理アプリ">
  <meta name="twitter:description" content="ジムボード - パーソナルジム・ピラティス・ヨガ専用の予約・顧客管理アプリ">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
