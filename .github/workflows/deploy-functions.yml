name: Deploy Edge Functions

# GitHub main への push で、ブラウザ/リダイレクトから叩かれる（JWT不要な）Edge Function を
# Supabase に自動デプロイする。（Lovable の手動デプロイを待たなくてよくなる）
#
# 前提: GitHub リポジトリの Settings → Secrets and variables → Actions に
#       SUPABASE_ACCESS_TOKEN を追加しておくこと（Supabase の Account → Access Tokens で発行）。
#
# 対象は「config.toml に verify_jwt=false を明記済みで、リダイレクト/通知の着地に関わる関数」。
# 他の関数を増やす場合は、その関数の verify_jwt を supabase/config.toml に明記してから
# 下の paths と deploy コマンドに追加すること。
# （config.toml に無い関数を deploy すると verify_jwt がデフォルトの true に戻り、
#   line-login-callback のような「JWT不要で叩かれる関数」が壊れるため。
#   このため send-transactional-email 等 config.toml 未記載の関数はここに足さず、
#   Lovable の Publish に任せる。）

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/google-calendar-auth-url/**"
      - "supabase/functions/google-calendar-callback/**"
      - "supabase/functions/google-calendar-sync/**"
      - "supabase/functions/line-login-callback/**"
      - "supabase/functions/send-push-notification/**"
      - "supabase/functions/notify-new-message/**"
      - "supabase/config.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rrbfwitprzuevzytykrq
    steps:
      - uses: actions/checkout@v4

      # デプロイ先が、このリポジトリ自身の Supabase プロジェクトかを確認する。
      #
      # PROJECT_REF はワークフローに直書きしてあるので、フォーク（兄弟アプリ）が
      # ここを直し忘れると **他人（ジムボード＝Salute御所南）の本番プロジェクトに
      # Edge Function を5本上書きデプロイする**。.env や config.toml と違って
      # Lovable の remix はここを直してくれない（ゴルフボードで実際に残っていた）。
      #
      # .env の VITE_SUPABASE_PROJECT_ID は各フォークが必ず自分の値に直しているので、
      # それと突き合わせれば「直し忘れ」を機械的に検出できる。
      - name: Preflight - デプロイ先がこのリポジトリのプロジェクトか
        run: |
          ENV_REF=$(grep -oE '^VITE_SUPABASE_PROJECT_ID="?([a-z0-9]+)"?' .env | sed -E 's/.*="?([a-z0-9]+)"?/\1/')
          if [ -z "$ENV_REF" ]; then
            echo "::error::.env から VITE_SUPABASE_PROJECT_ID を読み取れませんでした。"
            exit 1
          fi
          if [ "$ENV_REF" != "$PROJECT_REF" ]; then
            echo "::error::デプロイ先がこのリポジトリのプロジェクトと一致しません。"
            echo "  .env の VITE_SUPABASE_PROJECT_ID : $ENV_REF"
            echo "  このワークフローの PROJECT_REF   : $PROJECT_REF"
            echo ""
            echo "このまま実行すると **別プロジェクトの Edge Function を上書き** します。"
            echo "フォーク（兄弟アプリ）の場合は、このファイルの PROJECT_REF を"
            echo "自分のプロジェクトの ref に直してください（mem/ops/vertical-fork.md）。"
            exit 1
          fi
          echo "デプロイ先を確認しました: $PROJECT_REF"

      # SUPABASE_ACCESS_TOKEN 未設定なら、失敗にせずスキップする（緑のまま）。
      - name: Check for access token
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN が未設定のためデプロイをスキップします。"
            echo "GitHub の Settings → Secrets and variables → Actions に追加してください。"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.has_token == 'true'
        with:
          version: latest

      - name: Deploy redirect/notification functions
        if: steps.guard.outputs.has_token == 'true'
        run: |
          supabase functions deploy google-calendar-auth-url --project-ref "$PROJECT_REF"
          supabase functions deploy google-calendar-callback --project-ref "$PROJECT_REF"
          supabase functions deploy google-calendar-sync --project-ref "$PROJECT_REF"
          supabase functions deploy line-login-callback --project-ref "$PROJECT_REF"
          supabase functions deploy send-push-notification --project-ref "$PROJECT_REF"
          # 🔴 messages の AFTER INSERT トリガーから pg_net で叩かれる。
          #    **DBトリガーが呼ぶ関数は、誰も手で deploy しない。** ここに書かないと
          #    「トリガーは動くのに 404 で通知だけ飛ばない」状態になる。
          #    2026-08-12 に実際にその状態を作った（クライアント側の送信を先に外したため、
          #    通知が本番で数時間止まった）。src/test/messageNotification.test.ts が見張る。
          supabase functions deploy notify-new-message --project-ref "$PROJECT_REF"
