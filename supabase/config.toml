project_id = "rrbfwitprzuevzytykrq"

[functions]
  # Googleカレンダー連携。ブラウザ/リダイレクトから叩かれる callback は verify_jwt=false 必須。
  # auth-url / sync は関数内で verifyCaller により認証するため false で問題ない。
  [functions.google-calendar-auth-url]
    verify_jwt = false
  [functions.google-calendar-callback]
    verify_jwt = false
  [functions.google-calendar-sync]
    verify_jwt = false
  [functions.send-push-notification]
    verify_jwt = false
  # LINEログイン連携のOAuthコールバック。ブラウザのリダイレクトから JWT なしで叩かれる
  # ため verify_jwt=false 必須（config.toml に無いまま CLI で deploy すると既定の true に
  # 戻り、LINEログインが壊れる）。稼働中の設定に合わせて明記した（2026-07）。
  [functions.line-login-callback]
    verify_jwt = false
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.gymboard-stripe-webhook]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = true
  # 公開の体験予約作成API。外部予約サイトから認証なしで呼ばれる前提
  # (関数内で入力検証・営業枠チェック・回数制限を行う)。
  [functions.trial-book]
    verify_jwt = false
  # 公開のドロップイン予約作成API (trial-book の複製、観光客向け¥8,000単発セッション)。
  [functions.drop-in-book]
    verify_jwt = false
  # 体験予約のお客様セルフキャンセルAPI。確認メール/完了画面のリンクから認証なしで
  # 呼ばれる前提 (予約1件ごとの推測困難な cancel_token で本人確認する)。
  [functions.trial-cancel]
    verify_jwt = false
  # トレーナー向け朝のサマリー通知。pg_cron から JWT なしで叩かれる前提
  # (関数内で service_role / CRON_SECRET(x-cron-secret) のいずれかを必須にする)。
  [functions.daily-trainer-summary]
    verify_jwt = false
  # 新着メッセージのプッシュ通知。messages の AFTER INSERT トリガーから
  # pg_net で JWT なしで叩かれる前提 (daily-trainer-summary と同じ認可)。
  [functions.notify-new-message]
    verify_jwt = false
  # 予約の通知（店宛メール・受付確認・プッシュ）。bookings の AFTER INSERT
  # トリガーから pg_net で JWT なしで叩かれる前提 (notify-new-message と同じ認可)。
  [functions.notify-new-booking]
    verify_jwt = false
