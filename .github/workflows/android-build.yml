name: Android Build & Upload

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play の公開トラック"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 必要な Secrets を「最初に」まとめて検査する。
      #
      # 各ステップで個別にチェックすると、1つ登録するたびに次のステップで落ちるので、
      # 揃うまで実行を何往復もすることになる（初回セットアップで実際にそうなった）。
      # とくに GOOGLE_PLAY_SERVICE_ACCOUNT_JSON は最後のアップロード段でしか使われないため、
      # 未登録だと10分かけてビルドし終えてから落ちる。ここで足りないものを全部並べて出す。
      - name: Preflight - 必要な Secrets が揃っているか
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in GOOGLE_SERVICES_JSON_BASE64 ANDROID_KEYSTORE_BASE64 \
                      ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
                      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            # 値そのものは絶対に出さない。空かどうかだけを見る
            if [ -z "${!name}" ]; then
              missing="${missing}  - ${name}
          "
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::次の GitHub Secrets が未設定です（Settings → Secrets and variables → Actions）:"
            printf '%s' "$missing"
            echo "取得方法は mem/features/android-ci.md の「必要な GitHub Secrets」を参照してください。"
            echo "**全部登録してから再実行してください。** 1つずつだと毎回ここで止まります。"
            exit 1
          fi
          echo "必要な Secrets は6つとも登録されています。"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java (Capacitor 8 のネイティブモジュールは21でコンパイルされる)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @mediapipe/pose @tensorflow/tfjs-backend-webgpu @tensorflow/tfjs-backend-webgl @tensorflow/tfjs-core @tensorflow/tfjs-converter --legacy-peer-deps

      - name: Install Capacitor Android
        run: npm install @capacitor/android@^8 --legacy-peer-deps

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::secrets.GOOGLE_SERVICES_JSON_BASE64 が未設定です。Firebaseコンソールの" \
                 "google-services.json を base64 して GitHub Secrets に登録してください" \
                 "（mem/features/android-ci.md 参照）。"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-keys"
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/android-keys/google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/android-keys/google-services.json" >> "$GITHUB_ENV"

      - name: Patch Gradle config to Capacitor 8 baseline + wire Firebase
        run: node scripts/patch-android.mjs

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::secrets.ANDROID_KEYSTORE_BASE64 が未設定です（mem/features/android-ci.md 参照）。"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-keys"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-keys/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-keys/release.keystore" >> "$GITHUB_ENV"

      - name: Set version + wire signing config
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          # 手作業（Android Studio）時代に使い切った versionCode より確実に大きい値から
          # 始めるための下駄。手で採番していた番号がこの値に達することは実質ありえないので、
          # 初回CIリリースが `Version code N has already been used` で弾かれない。
          # ⚠️ もし初回アップロードでそのエラーが出たら、Play Console に上がっている
          # 最大の versionCode より大きくなるようこの値を上げること（下げるのは不可）。
          ANDROID_VERSION_CODE_BASE: "10000"
          # お客様に見えるバージョン表記。ワークフローの入力ではなくここに直書きして
          # あるのは、「バージョンを上げた」がコミットとして履歴に残るようにするため
          # （iOS が ios-build.yml に MARKETING_VERSION を直書きしているのと同じ理由）。
          #
          # ⚠️ 下げてはいけない。Play は versionName の順序を検査しないので下げても
          # 弾かれないが、お客様の画面では「更新したらバージョンが戻った」に見える。
          # iOS の MARKETING_VERSION（1.4.5 系）とは**別の線**である点に注意
          # （Android の方が数字が大きい。揃えるなら 9.x 側に上げる形になる）。
          # 経緯は mem/features/android-ci.md。
          ANDROID_VERSION_NAME: "9.1"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode は BASE + github.run_number（iOS の CURRENT_PROJECT_VERSION と同じ発想）。
          # android/ は毎回 `cap add android` で作り直すため、テンプレート既定値からの
          # 相対更新ができない。run_number は実行のたびに単調増加するので、
          # 「android/ を作り直すと versionCode が1に戻る」という手作業時代の地雷が
          # 構造的に起きない（mem/features/capacitor-8-upgrade.md「やってはいけないこと」）。
          # ただし run_number は 1 から始まるため、下駄なしだと初回だけ
          # 同じエラーを別経路で踏む。それを BASE で塞いでいる。
          node scripts/prepare-android-release.mjs

      - name: Build signed AAB
        env:
          # ANDROID_KEYSTORE_PATH は前段の $GITHUB_ENV 経由で既に環境変数として渡っている。
          # secrets.* は明示マップしないと引き継がれないので、ここで改めて渡す。
          # build.gradle 側は System.getenv(...) でこれらを読む（prepare-android-release.mjs 参照）。
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload to Google Play (${{ inputs.track }})
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.gymboard.mobile
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: draft
          # status: draft にしてある。internal 以外のトラックへ上げても Play Console 側で
          # 明示的に「確認して公開」を押すまで審査提出・公開はされない
          # （iOS の App Store Connect アップロードが自動で審査提出しないのと同じ安全側の既定）。
