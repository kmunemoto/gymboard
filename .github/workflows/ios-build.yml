name: iOS Build & Upload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: List available Xcode versions
        run: ls /Applications/ | grep Xcode

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @mediapipe/pose @tensorflow/tfjs-backend-webgpu @tensorflow/tfjs-backend-webgl @tensorflow/tfjs-core @tensorflow/tfjs-converter --legacy-peer-deps

      - name: Install Capacitor iOS
        run: npm install @capacitor/ios --legacy-peer-deps

      - name: Build web
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios || true

      - name: Generate app icon
        run: |
          mkdir -p assets
          cp gymboard-app-icon-1024.PNG assets/icon-only.png
          npx @capacitor/assets@3 generate --ios

      - name: Add iOS privacy usage descriptions to Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'ジムのロゴ、お客様の進捗写真、姿勢診断写真、食事記録の撮影に使用します。'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'ジムのロゴ、お客様の進捗写真、姿勢診断写真、食事記録の撮影に使用します。'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'ジムのロゴ、お客様の進捗写真、姿勢診断写真、食事記録の選択に使用します。'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'ジムのロゴ、お客様の進捗写真、姿勢診断写真、食事記録の選択に使用します。'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string '進捗写真や姿勢診断写真を保存する際に使用します。'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription '進捗写真や姿勢診断写真を保存する際に使用します。'" "$PLIST"
          echo "--- Info.plist after patch ---"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -A0 "UsageDescription"

      - name: Inject GoogleService-Info.plist
        run: |
          DEST="ios/App/App/GoogleService-Info.plist"
          cat > "$DEST" << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>API_KEY</key>
          <string>AIzaSyB8UmCsSZ9C6ePEr5f-Anf1XCovlgZbvQg</string>
          <key>GCM_SENDER_ID</key>
          <string>655937839767</string>
          <key>PLIST_VERSION</key>
          <string>1</string>
          <key>BUNDLE_ID</key>
          <string>app.gymboard.mobile</string>
          <key>PROJECT_ID</key>
          <string>gymboard-59570</string>
          <key>STORAGE_BUCKET</key>
          <string>gymboard-59570.firebasestorage.app</string>
          <key>IS_ADS_ENABLED</key>
          <false/>
          <key>IS_ANALYTICS_ENABLED</key>
          <false/>
          <key>IS_APPINVITE_ENABLED</key>
          <true/>
          <key>IS_GCM_ENABLED</key>
          <true/>
          <key>IS_SIGNIN_ENABLED</key>
          <true/>
          <key>GOOGLE_APP_ID</key>
          <string>1:655937839767:ios:24127d2563fa75b9667fd2</string>
          </dict>
          </plist>
          PLIST_EOF
          echo "--- validate as a property list ---"
          plutil -lint "$DEST"
          /usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$DEST" || true
          /usr/libexec/PlistBuddy -c "Print :PROJECT_ID" "$DEST" || true

      - name: Enable Push Notifications capability (aps-environment)
        run: |
          ENT="ios/App/App/App.entitlements"
          if [ ! -f "$ENT" ]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0">' '<dict>' '</dict>' '</plist>' > "$ENT"
          fi
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT"
          echo "--- App.entitlements after patch ---"
          /usr/libexec/PlistBuddy -c "Print" "$ENT"
          # Ensure the entitlements file is wired into the Xcode project
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          if ! grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements" "$PBX"; then
            sed -i '' 's|PRODUCT_BUNDLE_IDENTIFIER = app.gymboard.mobile;|CODE_SIGN_ENTITLEMENTS = App/App.entitlements; PRODUCT_BUNDLE_IDENTIFIER = app.gymboard.mobile;|g' "$PBX"
            echo "--- Wired CODE_SIGN_ENTITLEMENTS into project.pbxproj ---"
            grep "CODE_SIGN_ENTITLEMENTS" "$PBX" || true
          fi


      - name: Set build number
        run: |
          cd ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = 1;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" App.xcodeproj/project.pbxproj

      - name: Set marketing version
        run: |
          cd ios/App
          sed -i '' 's/MARKETING_VERSION = .*;/MARKETING_VERSION = 1.1.4;/g' App.xcodeproj/project.pbxproj

      - name: Fix Podfile for CI signing
        run: |
          sed -i '' "s/platform :ios, '.*'/platform :ios, '16.0'/" ios/App/Podfile
          python3 -c "
          content = open('ios/App/Podfile').read()
          fix = '''
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"
                end
              end
          '''
          content = content.replace('assertDeploymentTarget(installer)', 'assertDeploymentTarget(installer)' + fix)
          open('ios/App/Podfile', 'w').write(content)
          "

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Initialize Firebase in AppDelegate
        run: |
          DELEGATE="ios/App/App/AppDelegate.swift"

          if ! grep -q "import FirebaseCore" "$DELEGATE"; then
            sed -i '' '/^import UIKit$/a\
          import FirebaseCore
          ' "$DELEGATE"
            echo "--- Added import FirebaseCore ---"
          fi

          if ! grep -q "FirebaseApp.configure()" "$DELEGATE"; then
            sed -i '' '/didFinishLaunchingWithOptions.*-> Bool {/a\
                  FirebaseApp.configure()
          ' "$DELEGATE"
            echo "--- Added FirebaseApp.configure() ---"
          fi

          echo "--- AppDelegate.swift ---"
          cat "$DELEGATE"

      - name: Install CocoaPods
        run: cd ios/App && pod install

      - name: Configure App signing
        run: |
          cd ios/App
          sed -i '' 's/ProvisioningStyle = Automatic/ProvisioningStyle = Manual/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' App.xcodeproj/project.pbxproj

      - name: Import certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PASSWORD="temp_password"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Create ExportOptions.plist
        run: |
          cat > ios/App/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.gymboard.mobile</key>
              <string>GymBoard App Store</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Add GoogleService-Info.plist to Xcode target (Copy Bundle Resources)
        run: |
          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj
          ruby -e '
            require "xcodeproj"
            project_path = "ios/App/App.xcodeproj"
            plist_name = "GoogleService-Info.plist"
            project = Xcodeproj::Project.open(project_path)
            target = project.targets.find { |t| t.name == "App" } or abort("App target not found")
            app_group = project.main_group["App"] || project.main_group.find_subpath("App", true)
            file_ref = app_group.files.find { |f| f.display_name == plist_name } || app_group.new_reference(plist_name)
            already = target.resources_build_phase.files.any? { |bf| bf.file_ref && bf.file_ref.display_name == plist_name }
            target.add_resources([file_ref]) unless already
            project.save
            puts "OK: wired #{plist_name} into App resources (already_present=#{already})"
          '
          echo "--- pbxproj references to the plist (expect >= 1) ---"
          grep -c "GoogleService-Info.plist" ios/App/App.xcodeproj/project.pbxproj

      - name: Build archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="GymBoard App Store" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            -destination "generic/platform=iOS"

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/output \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p private_keys
          echo "$API_KEY" > private_keys/AuthKey_$API_KEY_ID.p8
          xcrun altool --upload-app -f $RUNNER_TEMP/output/App.ipa -t ios --apiKey $API_KEY_ID --apiIssuer $ISSUER_ID
