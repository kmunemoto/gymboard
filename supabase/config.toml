[functions]
  # Googleカレンダー連携。ブラウザ/リダイレクトから叩かれる callback は verify_jwt=false 必須。
  # auth-url / sync は関数内で verifyCaller により認証するため false で問題ない。
  [functions.google-calendar-auth-url]
    verify_jwt = false
  [functions.google-calendar-callback]
    verify_jwt = false
  [functions.google-calendar-sync]
    verify_jwt = false
  [functions.send-push-notification]
    verify_jwt = false
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.gymboard-stripe-webhook]
    verify_jwt = false
  [functions.gymboard-sync-trial-booking]
    verify_jwt = false
  [functions.gymboard-sync-booking]
    verify_jwt = false
  [functions.gymboard-sync-goal]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = true
  [functions.salute-connection-check]
    verify_jwt = false
  [functions.salute-migration-check]
    verify_jwt = false
  [functions.reconcile-bookings-from-salute]
    verify_jwt = false
  [functions.sync-trial-cancel-to-salute]
    verify_jwt = false
  # 公開の体験予約作成API。外部予約サイトから認証なしで呼ばれる前提
  # (関数内で入力検証・営業枠チェック・回数制限を行う)。
  [functions.trial-book]
    verify_jwt = false
