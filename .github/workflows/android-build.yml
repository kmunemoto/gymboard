name: Android Build & Upload

# ⚠️ 2026-08-03 現在、ジムボードではこのワークフローを**使っていない。**
#
# Android のリリースは従来どおり Windows + Android Studio で手作業で行う。
# 必要な GitHub Secrets が6種あり、うち GOOGLE_PLAY_SERVICE_ACCOUNT_JSON は
# Play Console と Google Cloud をまたぐ画面操作が要るため、準備コストが
# 移行のメリットに見合わないと判断した。
#
# workflow_dispatch のみなので、手で実行しない限り動かない。**放置して問題ない。**
# 消していないのは、Secrets さえ揃えれば動く状態にしてあり、
# Android のリリース経路そのものが無い兄弟アプリ（ピラボード等）には価値があるため。
#
# 再開する手順・必要な Secrets の取り方: mem/features/android-ci.md
# 5つは scripts/setup-android-secrets.ps1（Windows）で自動登録できる。

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play の公開トラック"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 必要な Secrets を「最初に」まとめて検査する。
      #
      # 各ステップで個別にチェックすると、1つ登録するたびに次のステップで落ちるので、
      # 揃うまで実行を何往復もすることになる（初回セットアップで実際にそうなった）。
      # とくに GOOGLE_PLAY_SERVICE_ACCOUNT_JSON は最後のアップロード段でしか使われないため、
      # 未登録だと10分かけてビルドし終えてから落ちる。ここで足りないものを全部並べて出す。
      - name: Preflight - 必要な Secrets が揃っているか
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in GOOGLE_SERVICES_JSON_BASE64 ANDROID_KEYSTORE_BASE64 \
                      ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
                      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            # 値そのものは絶対に出さない。空かどうかだけを見る
            if [ -z "${!name}" ]; then
              missing="${missing}  - ${name}
          "
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::次の GitHub Secrets が未設定です（Settings → Secrets and variables → Actions）:"
            printf '%s' "$missing"
            echo "取得方法は mem/features/android-ci.md の「必要な GitHub Secrets」を参照してください。"
            echo "**全部登録してから再実行してください。** 1つずつだと毎回ここで止まります。"
            echo "scripts/setup-android-secrets.ps1 を Windows で流すと5つは自動で登録できます。"
            exit 1
          fi
          echo "6つとも登録されています。次に中身の形を確認します。"

          # --- 中身の検査 -------------------------------------------------
          # 「登録されている」と「正しいものが登録されている」は別。
          # 貼り間違い（別アプリの json、base64 し忘れ、certutil のヘッダ付き）は
          # ここで止めないと、10分ビルドした後のアップロード段や
          # 「署名は通るのに Play が受け取らない」形でしか分からない。
          # 値そのものは絶対に出力しない。
          tmp="$RUNNER_TEMP/preflight"; mkdir -p "$tmp"
          bad=""
          # 追記は必ず1行で書くこと。YAML のブロックスカラー（run: |）の中で
          # 途中の行をこのインデントより浅くすると、そこでブロックが終端して
          # ワークフロー全体が構文エラーになる（実際に一度壊した）。
          add_bad() { bad="${bad}  - $1"$'\n'; }

          if ! printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$tmp/gs.json" 2>/dev/null; then
            add_bad "GOOGLE_SERVICES_JSON_BASE64: base64 として読めません。certutil -encode は BEGIN/END ヘッダが付くので不可。PowerShell の [Convert]::ToBase64String(...) を使ってください。"
          elif ! grep -q '"package_name"[[:space:]]*:[[:space:]]*"app.gymboard.mobile"' "$tmp/gs.json"; then
            add_bad "GOOGLE_SERVICES_JSON_BASE64: app.gymboard.mobile の設定が入っていません（別アプリのものかもしれません）。"
          elif ! grep -q "\"project_id\"[[:space:]]*:[[:space:]]*\"$(cat .github/expected-firebase-project-id)\"" "$tmp/gs.json"; then
            # ⚠️ アプリに焼く google-services.json の project_id と、サーバ側の送信鍵
            # （Supabase Secrets の FIREBASE_SERVICE_ACCOUNT_JSON）の project_id が
            # 違うと、**端末にトークンは保存されるのに配信だけ 403 SENDER_ID_MISMATCH で
            # 無言で失敗する**。ピラボードが実際に踏んだ（gymboard-59570 の設定が
            # 混入していた。ログには出ていたが人間が見ていなかった）。
            # 期待値は .github/expected-firebase-project-id で1箇所に持つ。
            add_bad "GOOGLE_SERVICES_JSON_BASE64: Firebase の project_id が .github/expected-firebase-project-id と違います（別プロジェクトの設定です。プッシュが無言で届かなくなります）。"
          fi

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$tmp/ks" 2>/dev/null; then
            add_bad "ANDROID_KEYSTORE_BASE64: base64 として読めません（同上）。"
          else
            # キーストアの先頭4バイトで種別を判定する（Java 不要）。
            # JKS=feedfeed / JCEKS=cececece / PKCS12=DER の SEQUENCE(3082)
            magic=$(head -c 4 "$tmp/ks" | od -An -tx1 | tr -d ' \n')
            case "$magic" in
              feedfeed|cececece|3082*) : ;;
              *) add_bad "ANDROID_KEYSTORE_BASE64: キーストアではないファイルのようです（.jks / .keystore を指定してください）。" ;;
            esac
          fi

          # このSecretだけ base64 化しない。取り違えが多いので明示的に見る。
          if ! printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | grep -q '"type"[[:space:]]*:[[:space:]]*"service_account"'; then
            add_bad "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: サービスアカウントのJSONに見えません。この Secret だけ base64 化しません。ダウンロードしたJSONの中身をそのまま貼ってください。"
          elif ! printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | grep -q '"private_key"'; then
            add_bad "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: private_key がありません（鍵ファイルではない可能性）。"
          fi

          rm -rf "$tmp"

          if [ -n "$bad" ]; then
            echo "::error::Secrets の中身に問題があります:"
            printf '%s' "$bad"
            echo "詳細は mem/features/android-ci.md を参照してください。"
            exit 1
          fi
          echo "Secrets の形も問題ありません。"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java (Capacitor 8 のネイティブモジュールは21でコンパイルされる)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @mediapipe/pose @tensorflow/tfjs-backend-webgpu @tensorflow/tfjs-backend-webgl @tensorflow/tfjs-core @tensorflow/tfjs-converter --legacy-peer-deps

      - name: Install Capacitor Android
        run: npm install @capacitor/android@^8 --legacy-peer-deps

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::secrets.GOOGLE_SERVICES_JSON_BASE64 が未設定です。Firebaseコンソールの" \
                 "google-services.json を base64 して GitHub Secrets に登録してください" \
                 "（mem/features/android-ci.md 参照）。"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-keys"
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/android-keys/google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/android-keys/google-services.json" >> "$GITHUB_ENV"

      - name: Patch Gradle config to Capacitor 8 baseline + wire Firebase
        run: node scripts/patch-android.mjs

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::secrets.ANDROID_KEYSTORE_BASE64 が未設定です（mem/features/android-ci.md 参照）。"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-keys"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-keys/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-keys/release.keystore" >> "$GITHUB_ENV"

      - name: Set version + wire signing config
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          # 手作業（Android Studio）時代に使い切った versionCode より確実に大きい値から
          # 始めるための下駄。手で採番していた番号がこの値に達することは実質ありえないので、
          # 初回CIリリースが `Version code N has already been used` で弾かれない。
          # ⚠️ もし初回アップロードでそのエラーが出たら、Play Console に上がっている
          # 最大の versionCode より大きくなるようこの値を上げること（下げるのは不可）。
          ANDROID_VERSION_CODE_BASE: "10000"
          # お客様に見えるバージョン表記。ワークフローの入力ではなくここに直書きして
          # あるのは、「バージョンを上げた」がコミットとして履歴に残るようにするため
          # （iOS が ios-build.yml に MARKETING_VERSION を直書きしているのと同じ理由）。
          #
          # ⚠️ 下げてはいけない。Play は versionName の順序を検査しないので下げても
          # 弾かれないが、お客様の画面では「更新したらバージョンが戻った」に見える。
          # iOS の MARKETING_VERSION（1.4.5 系）とは**別の線**である点に注意
          # （Android の方が数字が大きい。揃えるなら 9.x 側に上げる形になる）。
          # 経緯は mem/features/android-ci.md。
          ANDROID_VERSION_NAME: "9.1"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode は BASE + github.run_number（iOS の CURRENT_PROJECT_VERSION と同じ発想）。
          # android/ は毎回 `cap add android` で作り直すため、テンプレート既定値からの
          # 相対更新ができない。run_number は実行のたびに単調増加するので、
          # 「android/ を作り直すと versionCode が1に戻る」という手作業時代の地雷が
          # 構造的に起きない（mem/features/capacitor-8-upgrade.md「やってはいけないこと」）。
          # ただし run_number は 1 から始まるため、下駄なしだと初回だけ
          # 同じエラーを別経路で踏む。それを BASE で塞いでいる。
          node scripts/prepare-android-release.mjs

      - name: Build signed AAB
        env:
          # ANDROID_KEYSTORE_PATH は前段の $GITHUB_ENV 経由で既に環境変数として渡っている。
          # secrets.* は明示マップしないと引き継がれないので、ここで改めて渡す。
          # build.gradle 側は System.getenv(...) でこれらを読む（prepare-android-release.mjs 参照）。
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload to Google Play (${{ inputs.track }})
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.gymboard.mobile
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: draft
          # status: draft にしてある。internal 以外のトラックへ上げても Play Console 側で
          # 明示的に「確認して公開」を押すまで審査提出・公開はされない
          # （iOS の App Store Connect アップロードが自動で審査提出しないのと同じ安全側の既定）。
