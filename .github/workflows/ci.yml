name: CI

# PR と main への push で、型チェック・テスト・本番ビルドを自動実行する。
#
# これまで検証は手元で `npm run build` を叩くだけで、CIが無かったため
# 「テストは書いてあるが誰も走らせていない」状態になっていた。
# 特に src/test/schemaDrift.test.ts（マイグレーションの未適用検出）は
# 自動で回らないと意味がないので、ここで必ず実行する。
#
# lint は既存コードに大量の指摘（no-explicit-any 等）が残っているため、
# 落とすと全PRが赤になる。ゲートには入れず、状況が見えるよう参考表示のみ行う。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同じブランチで新しいpushがあったら前の実行を止める（CI待ちの詰まり防止）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 型チェック（tsconfig.app.json = src 配下。Edge Function は Deno なので対象外）
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      # src/lib だけ strict（strictNullChecks + noImplicitAny）で通す。
      #
      # 全体を strict にすると数百件出て一度には直せない。純粋なロジックが集まる
      # src/lib から段階的に広げる（mem/ops/strict-ratchet.md）。
      # 🔴 lib は components / hooks に依存しない。依存すると、lib を検査するだけで
      #    画面の木まで引きずり込まれてこのゲートが意味を失う。
      - name: Type check (strict, src/lib)
        run: npm run typecheck:strict

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 参考表示のみ。既存の指摘が解消されるまでゲートにはしない。
      - name: Lint (informational)
        continue-on-error: true
        run: npx eslint .

  # 主要導線の E2E（fixtures モードのUIスモーク）。
  #
  # 上の verify とは別ジョブにしてある。落ちたときに「型/ユニットが赤い」のか
  # 「画面が開かない」のかが、ジョブ名だけで分かるようにするため。
  #
  # ブラウザはランナーに入れる。ローカルの開発コンテナには /opt/pw-browsers に
  # プリインストール済みの実体があり、playwright.config.ts が存在チェックで
  # 自動的に使い分ける（PW_CHROMIUM_PATH で上書きも可能）。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # fixtures モードの dev サーバーは playwright.config.ts の webServer が起動する
      - name: E2E
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
